<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description"
    content="A SyntaxWear é uma loja de tênis e calçados que oferece uma ampla variedade de produtos para homens e mulheres. Com um compromisso com a qualidade, estilo e conforto, a SyntaxWear é o destino ideal para quem busca os melhores tênis do mercado. Explore nossa coleção e encontre o par perfeito para cada ocasião." />

  <title>SyntaxWear - Tênis e Calçados</title>

  <link rel="stylesheet" href="src/css/reset.css" />
  <link rel="stylesheet" href="src/css/variables.css" />
  <link rel="stylesheet" href="src/css/base.css" />
  <link rel="stylesheet" href="src/css/layout.css" />

  <link rel="stylesheet" href="src/css/components/header.css" />
  <link rel="stylesheet" href="src/css/components/hero.css" />
  <link rel="stylesheet" href="src/css/components/product-category.css" />
</head>

<body>
  <header class="header" role="banner">
    <h1 class="logo">
      <a href="/" title="SyntaxWare - Tênis e Calçados">
        <img src="./src/images/logo/logo.svg" alt="SyntaxWear - Tênis e Calçados" />
      </a>
    </h1>

    <nav class="nav-center" aria-label="Categorias Principais">
      <ul>
        <li><a href="#">Masculino</a></li>
        <li><a href="#">Feminino</a></li>
        <li><a href="#">Outlet</a></li>
      </ul>
    </nav>

    <nav class="nav-right" aria-label="Menu de usuário">
      <ul>
        <li><a href="#">Nossas lojas</a></li>
        <li><a href="#">Sobre</a></li>
        <li>
          <a href="#" aria-label="Conta do usuário"><img src="./src/images/icons/user.svg" alt="Usuário" /></a>
        </li>
        <li>
          <a href="#" aria-label="Ajuda"><img src="./src/images/icons/help.svg" alt="Ajuda" /></a>
        </li>
        <li>
          <a href="#" aria-label="Carrinho de compras"><img src="./src/images/icons/cart.svg" alt="Carrinho" /></a>
        </li>
      </ul>
    </nav>
  </header>

  <main id="main" role="main">
    <section class="hero-section" id="hero" aria-label="Seção hero">
      <div class="hero-overlay">
        <div class="hero-content">
          <span class="hero-subtitle">Krypton One</span>
          <h2 class="hero-title">Transforme qualquer passo em presença</h2>

          <div class="hero-buttons">
            <a class="btn btn-outline" href="#">Ver modelos</a>
            <a class="btn btn-filled" href="#">Comprar</a>
          </div>
        </div>
      </div>
    </section>

    <section class="categories-section" id="categories" aria-label="Categorias de tênis">
      <div class="category-card casual">
        <a href="#" class="category-link">
          <span class="overlay"></span>
          <span class="category-name btn btn-outline">Casual</span>
        </a>
      </div>
      <div class="category-card esporte">
        <a href="#" class="category-link">
          <span class="overlay"></span>
          <span class="category-name btn btn-outline">Esporte</span>
        </a>
      </div>
      <div class="category-card moderno">
        <a href="#" class="category-link">
          <span class="overlay"></span>
          <span class="category-name btn btn-outline">Moderno</span>
        </a>
      </div>
      <div class="category-card futurista">
        <a href="#" class="category-link">
          <span class="overlay"></span>
          <span class="category-name btn btn-outline">Futurista</span>
        </a>
      </div>
    </section>

    <section class="featured-products" id="featured-products" aria-label="Produtos em destaque">
      <div class="product-grid" role="list"></div>
    </section>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="container">
      <section class="contact" aria-label="Informações de contato"></section>
      <nav class="footer-nav" aria-label="Links do rodapé"></nav>
    </div>
  </footer>
</body>
<script src="src/js/main.js"></script>

</html>
